<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Derived from ../logo.svg. Two deliberate differences, do not "fix" them:
       1. No drop shadow. macOS composites its own Dock shadow; a baked one
          doubles up. Windows and Linux draw the bitmap flat.
       2. Everything is wrapped in the #bleed group below, which scales the
          artwork about the canvas centre by 512/448 so logo.svg's squircle
          (x=32..480) lands exactly on 0..512. Icons are shown at a fixed cell
          size, so a 32px transparent margin just renders Kite smaller than
          every neighbouring icon.
       Edit logo.svg for artwork changes, then re-apply these two edits here. -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06021f" />
      <stop offset="50%" stop-color="#0e0f3d" />
      <stop offset="100%" stop-color="#112454" />
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyan-elec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3bf6ff" />
      <stop offset="100%" stop-color="#0051ff" />
    </linearGradient>

    <!-- White Blue Bright Gradient -->
    <linearGradient id="white-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#7bf0ff" />
    </linearGradient>

    <!-- Soft Magenta Accent Gradient -->
    <linearGradient id="magenta-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e200ff" />
      <stop offset="100%" stop-color="#7100ff" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed scale: 512/448 = 1.142857 about (256,256). -->
  <g id="bleed" transform="translate(256,256) scale(1.142857) translate(-256,-256)">

    <!-- Background Squircle (macOS / App Icon standard) -->
    <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bg-grad2)" stroke="#1a1c4b" stroke-width="2.5" />

    <!-- Cybernetic Geometric Wind Trails / Social timeline streams -->
    <g opacity="0.25" stroke-linecap="round">
      <path d="M 80,380 C 140,380 180,330 240,330" fill="none" stroke="url(#magenta-grad)" stroke-width="3.5" />
      <path d="M 110,410 C 190,410 230,340 310,340" fill="none" stroke="url(#cyan-elec)" stroke-width="4" />
      <path d="M 280,160 C 340,160 380,110 440,110" fill="none" stroke="url(#cyan-elec)" stroke-width="3" />
    </g>

    <!-- Rotating and translating the entire Kite Assembly for a dynamic flight angle -->
    <g transform="translate(256, 210) rotate(18) translate(-256, -210)" filter="url(#neon-glow2)">

      <!-- 1. Geometric Diamond Kite Sails -->
      <!-- Top-Left Sail -->
      <polygon points="256,90 166,175 256,175" fill="url(#cyan-elec)" opacity="0.85" />
      <!-- Top-Right Sail -->
      <polygon points="256,90 346,175 256,175" fill="url(#white-blue)" opacity="0.9" />
      <!-- Bottom-Left Sail -->
      <polygon points="166,175 256,310 256,175" fill="url(#magenta-grad)" opacity="0.8" />
      <!-- Bottom-Right Sail -->
      <polygon points="346,175 256,310 256,175" fill="url(#cyan-elec)" opacity="0.85" />

      <!-- 2. Cyber-style Inner Accent Lines (makes the kite look high-tech and translucent) -->
      <polygon points="252,105 180,171 252,171" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35" />
      <polygon points="260,105 332,171 260,171" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35" />
      <polygon points="180,179 252,285 252,179" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35" />
      <polygon points="332,179 260,285 260,179" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35" />

      <!-- 3. Structural Spars (vertical spine and horizontal crossbar) -->
      <!-- Vertical Spine -->
      <line x1="256" y1="80" x2="256" y2="320" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
      <!-- Horizontal Crossbar (curved slightly backward like a high-performance kite) -->
      <path d="M 156,175 Q 256,165 356,175" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

      <!-- 4. Fluttering Cyber-Kite Tail -->
      <!-- The glowing tail cable -->
      <path d="M 256,318 C 245,360 215,395 210,440" fill="none" stroke="url(#magenta-grad)" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 256,318 C 245,360 215,395 210,440" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />

      <!-- 5. Geometric Butterfly Bows along the tail (nod to Bluesky butterflies!) -->
      <!-- Bow 1 -->
      <g transform="translate(248, 348) rotate(-10)">
        <polygon points="0,0 -12,-9 -5,0 -10,7" fill="url(#cyan-elec)" />
        <polygon points="0,0 12,-9 5,0 10,7" fill="url(#cyan-elec)" />
        <circle cx="0" cy="0" r="2" fill="#ffffff" />
      </g>
      <!-- Bow 2 -->
      <g transform="translate(227, 386) rotate(15)">
        <polygon points="0,0 -11,-8 -4,0 -9,6" fill="url(#magenta-grad)" />
        <polygon points="0,0 11,-8 4,0 9,6" fill="url(#magenta-grad)" />
        <circle cx="0" cy="0" r="1.8" fill="#ffffff" />
      </g>
      <!-- Bow 3 -->
      <g transform="translate(213, 424) rotate(-5)">
        <polygon points="0,0 -10,-7 -3,0 -8,5" fill="url(#white-blue)" />
        <polygon points="0,0 10,-7 3,0 8,5" fill="url(#white-blue)" />
        <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
      </g>

      <!-- 6. Stylized geometric origami butterfly at the exact center crossbar -->
      <!-- Represents the Bluesky client identity right at the heart of the kite -->
      <g transform="translate(256, 175) scale(1.1)">
        <!-- Left Upper Wing -->
        <polygon points="0,-1 -15,-15 -18,-5" fill="#ffffff" opacity="0.95" />
        <!-- Right Upper Wing -->
        <polygon points="0,-1 15,-15 18,-5" fill="#ffffff" opacity="0.95" />
        <!-- Left Lower Wing -->
        <polygon points="0,1 -11,8 -6,11" fill="#ffffff" opacity="0.85" />
        <!-- Right Lower Wing -->
        <polygon points="0,1 11,8 6,11" fill="#ffffff" opacity="0.85" />
        <!-- Center Core -->
        <polygon points="0,-6 -1.5,4 0,9 1.5,4" fill="#3bf6ff" />
      </g>
    </g>

    <!-- Outer frame glossy outline to complete the premium desktop client feel -->
    <rect x="52" y="52" width="408" height="408" rx="82" ry="82" fill="none" stroke="#252c6a" stroke-width="1.8" />
  </g>
</svg>
