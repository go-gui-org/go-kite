name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          path: go-kite

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      # No system packages. go-glyph has been pure Go since v1.19 (no
      # FreeType, HarfBuzz, Pango or SDL) and go-gui reaches GL through
      # purego, so Linux builds and tests with cgo disabled.
      #
      # macOS is the exception: the Metal backend is cgo. Without this the
      # darwin build still succeeds, but it silently links no Metal and
      # produces a binary whose GUI cannot open a window.
      - name: Enable cgo for the Metal backend
        if: runner.os == 'macOS'
        run: echo "CGO_ENABLED=1" >> "$GITHUB_ENV"

      - name: Test
        working-directory: go-kite
        run: go test ${{ runner.os == 'Linux' && '-race' || '' }} ./...

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: go-kite

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Vet
        working-directory: go-kite
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: go-kite
          args: ./...
